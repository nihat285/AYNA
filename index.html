<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>AYNA SmartFlow AI</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#070d18;--pn:#0f1a2e;--bd:#1f3050;--tx:#e6edf7;--mu:#8ea3c4;--ac:#38bdf8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--bd);background:#0a1426}
h1{font-size:18px;margin:0;letter-spacing:.08em}h1 small{display:block;font-size:11px;font-weight:400;color:var(--mu);letter-spacing:.04em}
h2{font-size:12px;letter-spacing:.1em;color:var(--mu);margin:0 0 10px;text-transform:uppercase}
.tag{padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid}
.demo{color:#eab308;border-color:#eab308}.real{color:#22c55e;border-color:#22c55e}.on{color:#22c55e}
nav button,.btn{background:var(--pn);color:var(--tx);border:1px solid var(--bd);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit;transition:.2s}
nav button.a,.btn:hover,nav button:hover{border-color:var(--ac);color:var(--ac)}
.btn.p{background:var(--ac);color:#04121f;font-weight:700;border-color:var(--ac)}.btn.p:hover{filter:brightness(1.1);color:#04121f}
main{padding:16px 18px;max-width:1400px;margin:auto}
.grid{display:grid;gap:14px}.k4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:14px;min-width:0}
.kpi b{font-size:28px;display:block}.kpi span{color:var(--mu);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:500;text-align:left;font-size:11px;text-transform:uppercase}td,th{padding:6px 8px;border-bottom:1px solid var(--bd)}tr.r{cursor:pointer}tr.r:hover{background:#15243f}
.sc{overflow-x:auto}.ch{width:100%;height:auto}.lg span{margin-right:14px;font-size:12px;color:var(--mu)}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.pill{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;color:#04121f}
.rec{border-left:4px solid;padding:8px 12px;margin-bottom:10px;background:#0b1527;border-radius:0 8px 8px 0}.rec small{color:var(--mu);display:block}
.why{background:#0b1527;border:1px dashed var(--bd);border-radius:8px;padding:10px;font-size:13px}
.banner{background:#0c2a44;border:1px solid var(--ac);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-weight:600}
.cmp{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px 10px;font-size:13px;align-items:center}.cmp .h{color:var(--mu);font-size:11px;text-transform:uppercase}.good{color:#22c55e;font-weight:700}
input{background:#0b1527;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:4px 6px;width:64px;font:inherit}label{font-size:12px;color:var(--mu);margin-right:12px}
.drop{border:2px dashed var(--bd);border-radius:12px;padding:40px;text-align:center;color:var(--mu)}.drop.h{border-color:var(--ac)}
.note{font-size:11px;color:var(--mu)}.flash{animation:fl 1.5s 2}@keyframes fl{50%{box-shadow:0 0 0 3px #22c55e}}
body{background:radial-gradient(1100px 480px at 85% -8%,#0e2f57 0,transparent 60%),radial-gradient(800px 400px at 0 0,#0b2340 0,transparent 55%),var(--bg) fixed}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;backdrop-filter:blur(10px);background:rgba(8,16,32,.85)}
h1{display:flex;align-items:center;gap:10px}.logo-image{width:112px;height:48px;object-fit:contain;display:block;flex:0 0 auto}.logo{display:none}
.on{animation:bl 2s infinite}@keyframes bl{50%{opacity:.55}}
.card{background:linear-gradient(180deg,#112039,#0d182b);box-shadow:0 4px 18px #0006;transition:border-color .2s,transform .2s}.card:hover{border-color:#2d4a7a}
.kpi{border-top:3px solid var(--c,#38bdf8)}.kpi b{font-size:30px;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums}.kpi span{text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.rec{transition:.2s}.rec:hover{transform:translateX(3px);background:#0e1c34}
.bar{height:4px;background:#15243f;border-radius:4px;margin-top:4px;min-width:70px;overflow:hidden}.bar i{display:block;height:100%;border-radius:4px;transition:width .6s}
.pulse{animation:pu 1.6s infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.8)}}
.cmp>div:nth-child(4n+3):not(.h){background:#0d2620;border-radius:4px;padding:3px 6px}.cmp>div:nth-child(4n+2):not(.h){background:#2a1216;border-radius:4px;padding:3px 6px}
.banner{box-shadow:0 0 22px #38bdf833}.btn.p{box-shadow:0 0 16px #38bdf866}
@media(max-width:600px){main{padding:10px}header{padding:10px}.kpi b{font-size:24px}.cmp{font-size:12px}nav{width:100%;display:flex;gap:6px}nav button{flex:1;padding:7px 4px}}
</style></head><body><div id="app"></div>
<script>
const S={cap:80,target:.8,cycle:90,defInt:12,view:'dash',sel:null,src:'DEMO DATA',D:null,P:null,R:null,sim:null,upl:null,banner:'',hl:0};
const HRS=[...Array(19)].map((_,i)=>i+5),LB=HRS.map(h=>h+':00'),DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ST=[['LOW','NORMAL','#22c55e'],['MEDIUM','MODERATE','#eab308'],['HIGH','HIGH','#f97316'],['CRITICAL','OVERCAPACITY','#ef4444']];
const stat=o=>o<.6?0:o<.8?1:o<=1?2:3,fmt=n=>Math.round(n).toLocaleString('en'),pc=n=>Math.round(n*100)+'%',hh=h=>String(h).padStart(2,'0')+':00';
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),sleep=ms=>new Promise(r=>setTimeout(r,ms)),clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const prof=h=>Math.exp(-((h-8.3)**2)/4)+.95*Math.exp(-((h-18)**2)/5)+.42*Math.exp(-((h-13)**2)/12)+.12;

/* ---------- DATA LAYER: demo generator (clearly labelled DEMO) ---------- */
function layout(ids){return ids.map((id,i)=>{const a=i*2*Math.PI/ids.length,p=(k,r,o=0)=>[50+r*42*Math.cos(a+o),35+r*29*Math.sin(a+o)];return{id,pts:[p(0,1),p(0,.55,.25),p(0,.2,.5)]}})}
function genDemo(){
  const def=[['65',12,1.38],['1',8,.62],['2',10,.95],['3',9,.5],['5',15,1.12],['13',10,.72],['28',12,.88],['88',20,.55],['125',15,1.22],['34',10,.4],['24',14,.68],['8',12,.9]];
  let seed=7;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
  const N=35,now=new Date();now.setHours(0,0,0,0);const dates=[...Array(N)].map((_,i)=>new Date(now.getTime()-(N-i)*864e5));
  const L=layout(def.map(d=>d[0])),data={},routes=[];
  def.forEach(([id,iv,f],ri)=>{routes.push({id,iv,pts:L[ri].pts});const peak=f*80*60/iv;
    data[id]=dates.map((d,di)=>{const a=Array(24).fill(null),we=d.getDay()%6==0?.6:1;HRS.forEach(h=>a[h]=Math.round(peak*prof(h)*we*(1+di*.002)*(.9+.2*rnd())));return a})});
  return{routes,dates,data}}

/* ---------- PREDICTION: recency-weighted same-weekday seasonal baseline + backtest ---------- */
function build(D){
  const n=D.dates.length,dow=D.dates.map(d=>d.getDay());dow.push(new Date(D.dates[n-1].getTime()+864e5).getDay());
  const pred=(r,di,h)=>{let a=0,b=0,c=0,w=1;for(let k=di-1;k>=0;k--)if(dow[k]==dow[di]){const v=D.data[r][k][h];if(v!=null){a+=w*v;b+=w;c++}w*=.6}
    if(c>=2)return a/b;let s=0,m=0;for(let k=Math.max(0,di-7);k<di;k++){const v=D.data[r][k][h];if(v!=null){s+=v;m++}}return m?s/m:0};
  let M=null;const ys=[],ps=[];
  if(n>=21)for(let di=n-7;di<n;di++)D.routes.forEach(r=>HRS.forEach(h=>{const y=D.data[r.id][di][h];if(y!=null){ys.push(y);ps.push(pred(r.id,di,h))}}));
  if(ys.length){const mu=ys.reduce((a,b)=>a+b)/ys.length,se=ys.reduce((a,y,i)=>a+(y-ps[i])**2,0),ae=ys.reduce((a,y,i)=>a+Math.abs(y-ps[i]),0),st=ys.reduce((a,y)=>a+(y-mu)**2,0);M={mae:ae/ys.length,rmse:Math.sqrt(se/ys.length),r2:1-se/st,n:ys.length}}
  const routes=D.routes.map(r=>{
    const pv=HRS.map(h=>pred(r.id,n,h)),hist=HRS.map(h=>{let s=0,m=0;for(let k=Math.max(0,n-14);k<n;k++){const v=D.data[r.id][k][h];if(v!=null){s+=v;m++}}return m?s/m:0});
    const wk=DN.map((_,d)=>{let s=0,m=0;D.data[r.id].forEach((day,k)=>{if(dow[k]==d){s+=day.reduce((a,b)=>a+(b||0),0);m++}});return m?s/m:0});
    return{...r,pv,hist,wk}});
  S.P={routes,M,tdate:new Date(D.dates[n-1].getTime()+864e5),days:n};compute()}

/* ---------- OPTIMIZATION: required trips/h = ceil(demand / (capacity x target load)); interval = 60/trips; fleet = ceil(cycle/interval) ---------- */
function compute(){
  S.R=S.P.routes.map(r=>{const cap0=60/r.iv*S.cap,opt=r.pv.map(d=>{const trips=Math.max(1,Math.ceil(d/(S.cap*S.target))),iv=clamp(Math.round(60/trips),3,30);return{trips,iv,fleet:Math.ceil(S.cycle/iv)}});
    const occ=r.pv.map(d=>d/cap0),pi=r.pv.indexOf(Math.max(...r.pv)),fleet=Math.ceil(S.cycle/r.iv),need=Math.max(...opt.map(o=>o.fleet));
    return{...r,cap0,opt,occ,pi,pk:r.pv[pi],mo:occ[pi],fleet,need,delta:need-fleet,over:occ.filter(o=>o>1).length,st:stat(occ[pi]),ivo:opt[pi].iv}});
  S.sim=null}
function realloc(){const don=S.R.filter(r=>r.delta<0).map(r=>({id:r.id,n:-r.delta})).sort((a,b)=>b.n-a.n),out=[];let unmet=0;
  S.R.filter(r=>r.delta>0).sort((a,b)=>b.delta-a.delta).forEach(r=>{let need=r.delta;don.forEach(d=>{if(need>0&&d.n>0){const k=Math.min(need,d.n);d.n-=k;need-=k;out.push({from:d.id,to:r.id,n:k})}});unmet+=need});return{out,unmet}}
function why(r){const t=r.pi,o=r.opt[t],base=r.hist[t],ch=base?(r.pk/base-1):0,cur=Math.ceil(S.cycle/r.iv);
  return`Predicted demand ${fmt(r.pk)} passengers at ${hh(HRS[t])}–${hh(HRS[t]+1)} (${ch>=0?'+':''}${pc(ch)} vs. the 14-day average for that hour). Current capacity is ${fmt(r.cap0)} passengers/h (${r.iv} min interval × ${S.cap} seats). Demand/capacity: ${pc(r.mo)}. To hold load near ${pc(S.target)}, ${o.trips} trips/h are needed → interval ${o.iv} min. Fleet needed at peak: ${r.need} buses vs. ${cur} assumed now (${r.delta>=0?'+':''}${r.delta}).`}

/* ---------- SIMULATION (all values computed from predictions) ---------- */
function simulate(){const z=()=>({ws:0,d:0,ov:0,cov:0,occ:0,b:0}),c=z(),o=z();
  S.R.forEach(r=>{r.pv.forEach((d,i)=>{const cc=r.cap0,co=60/r.opt[i].iv*S.cap;c.ws+=d*r.iv/2;o.ws+=d*r.opt[i].iv/2;c.d+=d;c.cov+=Math.min(d,cc);o.cov+=Math.min(d,co);c.ov+=d>cc;o.ov+=d>co;c.occ+=d*d/cc;o.occ+=d*d/co});c.b+=r.fleet;o.b+=r.need});
  const f=x=>({wait:x.ws/x.d,load:x.occ/x.d,ov:x.ov,cov:x.cov/x.d,buses:x.b});
  S.sim={c:f(c),o:f(o),rows:S.R.map(r=>({id:r.id,b:r.mo,a:r.pk/(60/r.ivo*S.cap)})).sort((a,b)=>b.b-a.b).slice(0,8),re:realloc()}}

/* ---------- CHART HELPERS (inline SVG) ---------- */
const lg=s=>'<div class="lg">'+s.map(x=>`<span><i style="background:${x.c}"></i>${x.n}</span>`).join('')+'</div>';
function line(series,labels,W=560,H=210){const p=36,mx=Math.max(1,...series.flatMap(s=>s.v))*1.1,x=i=>p+i*(W-p-8)/(labels.length-1||1),y=v=>H-24-v/mx*(H-38);let o=`<svg class="ch" viewBox="0 0 ${W} ${H}">`;
  for(let k=0;k<=4;k++){const v=mx*k/4;o+=`<line x1="${p}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="#1f3050"/><text x="${p-5}" y="${y(v)+3}" fill="#8ea3c4" font-size="9" text-anchor="end">${fmt(v)}</text>`}
  labels.forEach((l,i)=>{if(i%2==0)o+=`<text x="${x(i)}" y="${H-8}" fill="#8ea3c4" font-size="9" text-anchor="middle">${l}</text>`});
  series.forEach((s,j)=>{const pt=s.v.map((v,i)=>x(i)+','+y(v)).join(' ');if(j==1)o+=`<polygon points="${p},${H-24} ${pt} ${x(s.v.length-1)},${H-24}" fill="${s.c}" opacity=".13"/>`;o+=`<polyline points="${pt}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round" ${s.d?'stroke-dasharray="5 3"':''}/>`;if(j<2)s.v.forEach((v,i)=>o+=`<circle cx="${x(i)}" cy="${y(v)}" r="6" fill="transparent"><title>${s.n} ${labels[i]}: ${fmt(v)}</title></circle>`)});return o+'</svg>'+lg(series)}
function bars(labels,series,W=560,H=210,fm=fmt){const p=36,mx=Math.max(1e-9,...series.flatMap(s=>s.v))*1.15,gw=(W-p-8)/labels.length,bw=gw*.7/series.length,y=v=>H-24-v/mx*(H-38);let o=`<svg class="ch" viewBox="0 0 ${W} ${H}">`;
  for(let k=0;k<=4;k++){const v=mx*k/4;o+=`<line x1="${p}" x2="${W-8}" y1="${y(v)}" y2="${y(v)}" stroke="#1f3050"/><text x="${p-5}" y="${y(v)+3}" fill="#8ea3c4" font-size="9" text-anchor="end">${fm(v)}</text>`}
  labels.forEach((l,i)=>{o+=`<text x="${p+gw*(i+.5)}" y="${H-8}" fill="#8ea3c4" font-size="9" text-anchor="middle">${l}</text>`;series.forEach((s,j)=>{const x=p+gw*i+gw*.15+bw*j;o+=`<rect x="${x}" y="${y(s.v[i])}" width="${bw}" height="${H-24-y(s.v[i])}" fill="${s.c}" rx="2"/>`})});return o+'</svg>'+lg(series)}

/* ---------- VIEWS ---------- */
function mapSvg(){return`<div style="border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:#081222">
  <iframe title="Real map of Baku, Azerbaijan" src="https://www.openstreetmap.org/export/embed.html?bbox=49.70%2C40.25%2C50.05%2C40.52&amp;layer=mapnik&amp;marker=40.3784%2C49.8422" style="width:100%;height:340px;border:0;display:block" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px">
  <div class="note">Real street map of Baku · © OpenStreetMap contributors</div>
  <a href="https://www.openstreetmap.org/#map=12/40.3784/49.8422" target="_blank" rel="noopener noreferrer" style="color:var(--ac);font-size:12px">Open larger map ↗</a>
</div>
<div class="lg" style="margin-top:10px">${ST.map(t=>`<span><i style="background:${t[2]}"></i>${t[1]}</span>`).join('')}</div>
<div class="note">The map is geographic; route lines/locations are not plotted because the current demo data does not contain real AYNA route coordinates.</div>`}
function kpis(){const R=S.R,{out}=realloc();return`<div class="grid k4">${[['Active routes',R.length],['Predicted high-demand routes',R.filter(r=>r.st>=2).length],['Overcrowded periods (route-hours)',R.reduce((a,r)=>a+r.over,0)],['Recommended bus changes',R.filter(r=>r.delta!=0).length+' routes · '+out.reduce((a,x)=>a+x.n,0)+' bus moves']].map((k,i)=>`<div class="card kpi" style="--c:${['#38bdf8','#f97316','#ef4444','#22c55e'][i]}"><span>${['🚌','🔥','⚠','🔁'][i]} ${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>`}
function pill(i){return`<span class="pill" style="background:${ST[i][2]}">${ST[i][0]}</span>`}
function recs(){const R=[...S.R].filter(r=>r.st>=2).sort((a,b)=>b.mo-a.mo).slice(0,4),{out,unmet}=realloc();
  return R.map(r=>`<div class="rec" style="border-color:${ST[r.st][2]}"><b>⚠ Route ${esc(r.id)}</b> — ${ST[r.st][0]} demand expected ${hh(HRS[r.pi])}–${hh(HRS[r.pi]+1)}<small>RECOMMENDATION: interval ${r.iv} → ${r.ivo} min · buses ${r.delta>=0?'+':''}${r.delta} · demand/capacity ${pc(r.mo)}</small></div>`).join('')+
  out.slice(0,4).map(x=>`<div class="rec" style="border-color:#38bdf8">Consider reallocating <b>${x.n}</b> bus${x.n>1?'es':''} from Route ${esc(x.from)} to Route ${esc(x.to)}.<small>Recommendation only — no vehicles are controlled by this system.</small></div>`).join('')+(unmet?`<div class="note">Additional fleet still required after reallocation: ${unmet} bus(es).</div>`:'')}
function simView(){const s=S.sim;if(!s)return`<p class="note">Compares the current system with the optimized intervals for the forecast day. All values are computed from the predictions above.</p>`;
  const row=(n,a,b,f,lower=1)=>`<div>${n}</div><div>${f(a)}</div><div class="${(lower?b<a:b>a)?'good':''}">${f(b)}</div><div class="${b!=a&&(lower?b<a:b>a)?'good':''}">${b==a?'—':(b>a?'+':'')+Math.round((b/a-1)*100)+'%'}</div>`,c=s.c,o=s.o;
  return`<div class="cmp"><div class="h">Metric</div><div class="h">Current system</div><div class="h">Optimized system</div><div class="h">Change</div>`+
  row('Avg. waiting time (min)',c.wait,o.wait,v=>v.toFixed(1))+row('Crowding (demand-weighted load)',c.load,o.load,pc)+row('Overcrowded route-hours',c.ov,o.ov,v=>v)+row('Demand covered',c.cov,o.cov,pc,0)+row('Buses required (peak)',c.buses,o.buses,v=>v)+`</div><p class="note">Estimated by simulation. Avg. wait = interval/2 (random arrivals); capacity = 60/interval × seats.</p>`+
  bars(s.rows.map(r=>'R'+r.id),[{n:'Before: peak occupancy',v:s.rows.map(r=>r.b),c:'#ef4444'},{n:'After',v:s.rows.map(r=>r.a),c:'#22c55e'}],560,200,v=>pc(v))}
function dash(){const t=[...S.R].sort((a,b)=>b.mo-a.mo).slice(0,7),N=S.P.routes[0].pv.map((_,i)=>S.P.routes.reduce((a,r)=>a+r.pv[i],0)),H=S.P.routes[0].hist.map((_,i)=>S.P.routes.reduce((a,r)=>a+r.hist[i],0)),r=S.sel&&S.R.find(x=>x.id==S.sel),m=S.P.M;
  return kpis()+`<div class="card" style="margin:14px 0"><label>Bus capacity <input type="number" value="${S.cap}" onchange="cfg('cap',this.value)"></label><label>Target load % <input type="number" value="${S.target*100}" onchange="cfg('target',this.value/100)"></label><label>Round-trip time (min) <input type="number" value="${S.cycle}" onchange="cfg('cycle',this.value)"></label><label>Default interval for uploaded routes <input type="number" value="${S.defInt}" onchange="cfg('defInt',this.value)"></label><span class="note">Capacity &amp; intervals are assumptions, not official AYNA figures.</span></div>
  <div class="grid two"><div class="card"><h2>Baku — real street map</h2>${mapSvg()}${r?`<p><b>Route ${esc(r.id)}</b> ${pill(r.st)} ${pc(r.mo)} at peak <button class="btn" onclick="go('route')">Details →</button></p>`:''}</div>
  <div class="card"><h2>Demand forecast — when? (${DN[S.P.tdate.getDay()]} ${S.P.tdate.toLocaleDateString()})</h2>${r?`<b>Route ${esc(r.id)}</b>`+line([{n:'Recent avg (14d)',v:r.hist,c:'#8ea3c4'},{n:'Predicted',v:r.pv,c:'#38bdf8',d:1},{n:'Current capacity',v:r.pv.map(_=>r.cap0),c:'#ef4444',d:1}],LB):'<b>All routes</b>'+line([{n:'Recent avg (14d)',v:H,c:'#8ea3c4'},{n:'Predicted',v:N,c:'#38bdf8',d:1}],LB)}
  <p class="note">${m?`Backtest (last 7 days, ${fmt(m.n)} points): MAE ${m.mae.toFixed(1)} · RMSE ${m.rmse.toFixed(1)} · R² ${m.r2.toFixed(3)}`:'Not enough history (&lt;21 days) for validation metrics.'} Model: recency-weighted same-weekday baseline.</p></div></div>

function csv(t){const dl=[',',';','\t'].map(d=>[d,t.split('\n')[0].split(d).length]).sort((a,b)=>b[1]-a[1])[0][0],rows=[];let f='',row=[],q=0;
  for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=0}else f+=c}else if(c=='"')q=1;else if(c==dl){row.push(f);f=''}else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}
const SYN={route:/^(route|line|bus_?line|marsrut|marşrut)|route/i,pax:/passenger|ridership|pax|boarding|count|sərnişin/i,ts:/timestamp|date_?time|datetime|time|date|tarix/i};
function ptime(s){s=String(s).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return new Date(s+'T00:00:00');let d=new Date(s);if(!isNaN(d))return d;const m=s.match(/(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})[ T]*(\d{1,2})?:?(\d{2})?/);return m?new Date(+m[3],m[2]-1,+m[1],+m[4]||0,+m[5]||0):null}
async function file(f){if(!f)return;const rows=csv(await f.text()),H=(rows[0]||[]).map(x=>x.trim()),used=new Set(),ci={};
  for(const k of['route','pax','ts']){const i=H.findIndex((h,j)=>!used.has(j)&&SYN[k].test(h));if(i>=0){ci[k]=i;used.add(i)}}
  const fail=e=>{S.upl={err:e};render()};if(ci.route==null||ci.pax==null||ci.ts==null)return fail('Could not detect route / passengers / timestamp columns. Headers found: '+esc(H.join(', ')));
  const agg={},miss=[0,0,0];let ok=0,bad=0,timed=false,mn=1e15,mx=0;
  rows.slice(1).forEach(r=>{const id=String(r[ci.route]||'').trim().toUpperCase().replace(/^(ROUTE|BUS)[\s_-]*/,''),p=parseFloat(String(r[ci.pax]||'').replace(/[\s,]/g,'')),t=ptime(r[ci.ts]||'');if(!id)miss[0]++;if(isNaN(p))miss[1]++;if(!t)miss[2]++;
    if(!id||isNaN(p)||!t||p<0){bad++;return}ok++;const d=new Date(t);if(t.getHours())timed=true;d.setHours(0,0,0,0);const k=d.getTime();mn=Math.min(mn,k);mx=Math.max(mx,k);((agg[id]??={})[k]??=Array(24).fill(0))[t.getHours()]+=p});
  const ids=Object.keys(agg);if(!ok||(mx-mn)/864e5<2)return fail('Need at least 3 days of valid rows.');
  const dates=[];for(let k=Math.max(mn,mx-119*864e5);k<=mx;k+=864e5)dates.push(new Date(k));const pf=HRS.reduce((a,h)=>a+prof(h),0),data={};
  ids.forEach(id=>data[id]=dates.map(d=>{const a=Array(24).fill(null),x=agg[id][d.getTime()];if(x)HRS.forEach(h=>a[h]=timed?x[h]:x.reduce((s,v)=>s+v,0)*prof(h)/pf);return a}));
  const L=layout(ids);S.D={routes:ids.map((id,i)=>({id,iv:S.defInt,pts:L[i].pts})),dates,data};S.src='AYNA DATASET';S.sel=null;build(S.D);
  S.upl={name:f.name,cols:{route:H[ci.route],pax:H[ci.pax],ts:H[ci.ts]},ok,bad,total:ok+bad,miss,routes:ids.length,days:dates.length,head:H,prev:rows.slice(1,6),warn:(timed?'':'No hour-of-day in timestamps: daily totals were spread with a generic commuter profile. ')+'Intervals are not in the data: using default '+S.defInt+' min for all routes.'};render()}

const $app=document.getElementById('app');
function go(v){S.view=v;render();scrollTo(0,0)}function pick(id){S.sel=id;render()}
function cfg(k,v){v=+v;if(v>0){S[k]=v;if(k=='defInt'&&S.src!='DEMO DATA'){S.D.routes.forEach(r=>r.iv=v);build(S.D)}else compute()}render()}
function runSim(){simulate();S.hl=1;render()}
function loadDemo(){S.D=genDemo();S.src='DEMO DATA';S.upl=null;build(S.D)}
async function demo(){S.view='dash';S.hl=0;S.sel=null;S.banner='1/7 Loading demo scenario (synthetic DEMO DATA)…';loadDemo();render();scrollTo(0,0);
  const r=[...S.R].sort((a,b)=>b.mo-a.mo)[0],m=async(t,f)=>{await sleep(1800);S.banner=t;f&&f();render()};
  await m(`2/7 Highest-risk route selected: Route ${r.id}`,()=>S.sel=r.id);
  await m(`3/7 Prediction: ${fmt(r.pk)} passengers expected at ${hh(HRS[r.pi])} (${ST[r.st][0]} demand)`);
  await m(`4/7 Overcrowding detected: demand/capacity ${pc(r.mo)} — ${ST[r.st][1]}`);
  await m(`5/7 Recommendation: interval ${r.iv} → ${r.ivo} min, buses ${r.delta>=0?'+':''}${r.delta}`);
  await m('6/7 Running optimization simulation…',()=>{simulate();document.getElementById('sim')&&0});
  await m(`7/7 Result — overcrowded route-hours ${S.sim.c.ov} → ${S.sim.o.ov}; avg. wait ${S.sim.c.wait.toFixed(1)} → ${S.sim.o.wait.toFixed(1)} min (estimated by simulation)`,()=>S.hl=1);
  document.getElementById('sim').scrollIntoView({behavior:'smooth'})}
loadDemo();render();
